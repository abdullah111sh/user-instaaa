    let lastIndex = -1;


    async function chooseSeries() {

      const button =
        document.getElementById("chooseButton");

      const loading =
        document.getElementById("loading");

      button.disabled = true;
      loading.style.display = "block";


      let randomIndex;

      do {
        randomIndex =
          Math.floor(Math.random() * series.length);

      } while (
        randomIndex === lastIndex &&
        series.length > 1
      );


      lastIndex = randomIndex;

      const selected = series[randomIndex];


      /*
        البحث عن بيانات المسلسل
        من TVmaze
      */

      try {

        const response = await fetch(
          "https://api.tvmaze.com/singlesearch/shows?show=" +
          encodeURIComponent(selected.name)
        );

        if (!response.ok) {
          throw new Error("لم يتم العثور على المسلسل");
        }

        const data = await response.json();


        document.getElementById("seriesName").textContent =
          selected.name;


        document.getElementById("description").textContent =
          selected.description;


        document.getElementById("genre").textContent =
          data.genres && data.genres.length
            ? data.genres.join(" • ")
            : "مسلسل";


        document.getElementById("seasons").textContent =
          "📺 " +
          (data._embedded &&
           data._embedded.episodes
            ? countSeasons(data._embedded.episodes)
            : "—") +
          " مواسم";


        document.getElementById("runtime").textContent =
          "⏱️ " +
          (data.averageRuntime || data.runtime || "—") +
          " دقيقة";


        if (data.image && data.image.original) {

          document.getElementById("poster").src =
            data.image.original;

        } else {

          document.getElementById("poster").src =
            "https://via.placeholder.com/500x750?text=No+Poster";
        }

      } catch (error) {

        /*
          إذا ما حصلنا البيانات،
          نعرض الاسم والوصف على الأقل
        */

        document.getElementById("seriesName").textContent =
          selected.name;

        document.getElementById("genre").textContent =
          "مسلسل";

        document.getElementById("seasons").textContent =
          "📺 — مواسم";

        document.getElementById("runtime").textContent =
          "⏱️ — دقيقة";

        document.getElementById("description").textContent =
          selected.description;

      }


      loading.style.display = "none";
      button.disabled = false;
    }


    /*
      حساب عدد المواسم من الحلقات
    */

    function countSeasons(episodes) {

      const seasons = new Set();

      episodes.forEach(function(episode) {

        if (episode.season) {
          seasons.add(episode.season);
        }

      });

      return seasons.size || "—";
    }

  </script>
